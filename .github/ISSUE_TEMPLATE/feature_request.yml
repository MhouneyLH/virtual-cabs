name: Feature request
description: An idea or an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: context
    attributes:
      label: Context
      options: [Stops, Trips, Alerts, Ingestion, Common, AppHost, CI / devcontainer, Cross-context]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
