# Releases are cut by pushing a tag:
#   1.2.3          -> release
#   1.2.3-rc.1     -> release candidate (marked as pre-release)
name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate tag
        id: tag
        run: |
          tag="$GITHUB_REF_NAME"
          re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$'
          if ! [[ "$tag" =~ $re ]]; then
            echo "Tag '$tag' must look like major.minor.patch or major.minor.patch-rc.revision" >&2
            exit 1
          fi
          if ! git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/main$'; then
            echo "Tag '$tag' is not on main" >&2
            exit 1
          fi
          echo "prerelease=$([[ "$tag" == *-rc.* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build gleis-grain.slnx --configuration Release -p:Version="$GITHUB_REF_NAME"
      - name: Test
        run: dotnet test --solution gleis-grain.slnx --configuration Release -p:Version="$GITHUB_REF_NAME"

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=(--generate-notes --verify-tag --repo "$GITHUB_REPOSITORY")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" --title "$GITHUB_REF_NAME"
