# Reusable per-feature pipeline. Builds and tests one bounded context by project path.
name: feature

on:
  workflow_call:
    inputs:
      feature:
        description: Feature (bounded context) folder name, e.g. Stops
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ inputs.feature }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test --project test/Features/${{ inputs.feature }}/GleisGrain.${{ inputs.feature }}.Tests/GleisGrain.${{ inputs.feature }}.Tests.csproj --configuration Release
